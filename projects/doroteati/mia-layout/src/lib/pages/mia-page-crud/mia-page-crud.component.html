<div class="container-page intro-component-animation">
  <div class="topbar">
    <div class="breadcrumb"></div>
    @if (hasBackButton) {
      <button
        mat-icon-button
        [routerLink]="['/routePath']"
        class="btn-back"
        matTooltip="Back"
      >
        <mat-icon>arrow_back</mat-icon>
      </button>
    }
    <h1>
      <b>{{ config.title }}</b>
    </h1>

    @for (button of config.buttons; track button.key) {
      <button
        mat-flat-button
        class="btn-add {{ button.classes }}"
        color="primary"
        (click)="onClickButton(button.key)"
      >
        <mat-icon>{{ button.icon }}</mat-icon>
        <span>{{ button.title }}</span>
      </button>
    }
  </div>

  <div class="filters-section">
    @if (config.filterBox) {
      <mia-filter-box
        [config]="config.filterBox"
        [query]="config.tableConfig.query"
        (call)="onFilter($event)"
        [lang]="lang"
      ></mia-filter-box>
    }

    <div class="toolbar-controls">
      <div class="toolbar-two d-flex">
        @if (config.hasSearch) {
          <mat-form-field appearance="outline">
            <mat-icon matPrefix>search</mat-icon>
            <input
              matInput
              type="text"
              [placeholder]="lang == 'es' ? 'Buscar...' : 'Search...'"
              [formControl]="inputSearch"
            />
          </mat-form-field>
        }
      </div>

      <div class="filters-container">
        @if (config.showColumnsButton) {
          <mia-edit-columns
            [config]="config.tableConfig"
            [miaTable]="tableComp"
          >
            <button>{{ lang == 'es' ? 'Columnas' : 'Columnas' }}</button>
          </mia-edit-columns>
        }
      </div>
    </div>
  </div>

  <div class="table-wrapper">
    <div class="container-table">
      <mia-table
        #tableComp
        [config]="config.tableConfig"
        (loadDataCompleted)="onLoadDataCompleted($event)"
      ></mia-table>
    </div>
  </div>
</div>
