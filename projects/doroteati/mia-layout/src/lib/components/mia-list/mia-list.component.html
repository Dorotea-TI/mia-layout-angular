<mat-action-list>
  @for (item of items ?? []; track item.title + '-' + (item.route ?? item.action ?? '')) {
    @if (item.route) {
      <a
        mat-list-item
        [routerLink]="item.route"
        routerLinkActive="router-link-active"
        (click)="onClick(item)"
      >
        @if (item.icon) {
          <mat-icon>{{ item.icon }}</mat-icon>
        }
        @if (isOpen) {
          <span>{{ item.title }}</span>
        }
      </a>
    }

    @if (!item.route && item.action) {
      <a mat-list-item (click)="onClick(item)">
        @if (item.icon) {
          <mat-icon>{{ item.icon }}</mat-icon>
        }
        @if (isOpen) {
          <span>{{ item.title }}</span>
        }
      </a>
    }
  }
</mat-action-list>
